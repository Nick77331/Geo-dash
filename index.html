<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Playable Hub</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Arial', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .game-section { margin-bottom: 50px; }
        .iframe-wrapper { 
            position: relative; 
            width: 90%; 
            max-width: 800px; 
            height: 450px; 
            margin: 20px auto; 
            border: 4px solid #2ecc71; 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .fs-btn { 
            background: #2ecc71; color: #111; border: none; padding: 12px 24px; 
            font-size: 16px; cursor: pointer; border-radius: 8px; font-weight: bold; 
            transition: 0.2s; margin-top: 10px;
        }
        .fs-btn:hover { background: #27ae60; transform: scale(1.05); }
        h2 { color: #2ecc71; margin-top: 40px; text-transform: uppercase; }
    </style>
</head>
<body>

    <h1>Geometry Dash Hub</h1>
    <p>Play all versions directly in your browser.</p>

    <!-- Geometry Dash Lite -->
    <div class="game-section">
        <h2>Geometry Dash Lite</h2>
        <div class="iframe-wrapper" id="liteBox">
            <iframe src="https://geometry-lite.github.io/" allowfullscreen></iframe>
        </div>
        <button class="fs-btn" onclick="goFS('liteBox')">GO FULLSCREEN</button>
    </div>

    <!-- Geometry Dash Meltdown -->
    <div class="game-section">
        <h2>Meltdown</h2>
        <div class="iframe-wrapper" id="meltBox">
            <iframe src="https://geometry-dash-unbanned.github.io/play/geometry-dash-meltdown.html" allowfullscreen></iframe>
        </div>
        <button class="fs-btn" onclick="goFS('meltBox')">GO FULLSCREEN</button>
    </div>

    <!-- Geometry Dash SubZero -->
    <div class="game-section">
        <h2>SubZero</h2>
        <div class="iframe-wrapper" id="subBox">
            <iframe src="https://ouazgames.com/geometry-dash-subzero/" allowfullscreen></iframe>
        </div>
        <button class="fs-btn" onclick="goFS('subBox')">GO FULLSCREEN</button>
    </div>

    <script>
        function goFS(id) {
            var elem = document.getElementById(id);
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
        }
    </script>

</body>
</html>
