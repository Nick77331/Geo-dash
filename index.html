<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Fullscreen</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .game-container { position: relative; width: 800px; height: 450px; margin: 20px auto; border: 5px solid #2ecc71; border-radius: 10px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .fs-btn { background: #2ecc71; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .fs-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <h1>Geometry Dash Online</h1>
    
    <div class="game-container" id="gameBox">
        <!-- Embedding a web-compatible version -->
        <iframe id="gdFrame" src="https://geometry-lite.github.io/" allowfullscreen></iframe>
    </div>

    <button class="fs-btn" onclick="openFullscreen()">Play Fullscreen</button>

    <script>
        var elem = document.getElementById("gameBox");
        function openFullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
